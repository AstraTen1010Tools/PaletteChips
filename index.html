<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaletteChips</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#181a20',
                        cardBg: '#20232b',
                        cardBorder: '#2d313c',
                        cardBorderSubtle: '#262933',
                        accent: '#5a6578'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-track {
            background: #181a20;
        }
        ::-webkit-scrollbar-thumb {
            background: #2d313c;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f4453;
        }
        
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 0.5rem;
        }

        .glass-panel {
            background: rgba(32, 35, 43, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid #2d313c;
        }
    </style>
</head>
<body class="bg-darkBg text-slate-200 min-h-screen font-sans flex flex-col antialiased selection:bg-slate-700 selection:text-slate-100">

    <header class="sticky top-0 z-30 bg-cardBg/95 backdrop-blur-md border-b border-cardBorder px-4 lg:px-8 py-3.5 transition-all">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <!-- Brand Logo -->
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-slate-800 border border-slate-700/60 flex items-center justify-center text-slate-300">
                    <i class="fa-solid fa-palette text-sm"></i>
                </div>
                <div>
                    <h1 class="text-lg font-semibold tracking-wide text-slate-200">PaletteChips</h1>
                </div>
            </div>

            <!-- Top Actions -->
            <div class="flex items-center space-x-2 sm:space-x-2.5">
                <button onclick="toggleSavedDrawer()" class="px-3.5 py-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs font-medium transition flex items-center space-x-2 border border-slate-700/60">
                    <i class="fa-regular fa-folder-open text-slate-400"></i>
                    <span class="hidden sm:inline">已儲存色票</span>
                    <span id="savedCountBadge" class="bg-slate-700 text-slate-300 text-[11px] px-2 py-0.5 rounded-full font-mono">0</span>
                </button>
                
                <button onclick="exportJSON()" class="px-3 py-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs font-medium transition flex items-center space-x-2 border border-slate-700/60">
                    <i class="fa-solid fa-file-export text-slate-400"></i>
                    <span class="hidden sm:inline">匯出 JSON</span>
                </button>

                <label class="px-3 py-1.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs font-medium transition flex items-center space-x-2 border border-slate-700/60 cursor-pointer">
                    <i class="fa-solid fa-file-import text-slate-400"></i>
                    <span class="hidden sm:inline">匯入</span>
                    <input type="file" id="importInput" accept=".json" class="hidden" onchange="importJSON(event)">
                </label>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
        
        <!-- MAIN WORKSPACE CARD -->
        <section class="glass-panel rounded-2xl p-4 sm:p-6 space-y-5 border border-cardBorder">
            
            <!-- Workspace Header -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-cardBorderSubtle">
                <div>
                    <h2 class="text-lg font-semibold text-slate-200 tracking-wide">色票工作區</h2>
                    <p class="text-xs text-slate-400 mt-0.5">自訂 1 至 8 個顏色的色彩組合</p>
                </div>

                <div class="flex items-center gap-2 self-end sm:self-auto">
                    <button onclick="clearWorkspace()" class="px-3 py-1.5 rounded-xl border border-slate-700/60 text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 text-xs font-medium transition flex items-center gap-1.5">
                        <i class="fa-regular fa-trash-can text-slate-400"></i>
                        <span>清空工作區</span>
                    </button>
                    <button onclick="openSaveModal()" class="px-3.5 py-1.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-100 text-xs font-medium border border-slate-600/60 transition flex items-center gap-1.5 shadow-sm">
                        <i class="fa-regular fa-bookmark text-slate-300"></i>
                        <span>儲存色票</span>
                    </button>
                </div>
            </div>

            <!-- UNIFIED WORKSPACE LAYOUT -->
            <div class="space-y-5">
                
                <!-- TOP CONTROL AREA: Color Picker & Input Row -->
                <div class="bg-darkBg/70 rounded-xl p-3.5 border border-cardBorderSubtle flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-3.5 w-full">
                    
                    <!-- Input Controls -->
                    <div class="flex flex-wrap items-center gap-2.5 flex-1 min-w-0">
                        
                        <!-- Combined Color Swatch & Hex Field -->
                        <div class="relative flex items-center bg-cardBg border border-slate-700/80 rounded-xl px-2.5 py-1 focus-within:border-slate-500 transition-all flex-1 max-w-xs min-w-[180px]">
                            <!-- Color Picker Swatch -->
                            <input type="color" id="pickerInput" value="#6B7280" onchange="syncColorFromPicker(this.value)" class="w-7 h-7 rounded-lg cursor-pointer border-0 p-0 bg-transparent shrink-0">
                            
                            <span class="text-slate-500 font-mono pl-2 select-none text-xs">#</span>
                            <input type="text" id="hexText" value="6B7280" maxlength="6" oninput="syncColorFromText(this.value)" onkeydown="if(event.key==='Enter') addColorToPalette()" class="w-full bg-transparent text-slate-200 font-mono font-medium text-sm focus:outline-none px-1 uppercase tracking-wider" placeholder="6B7280">
                        </div>

                        <!-- Random Color Button -->
                        <button onclick="generateRandomColor()" class="px-3 py-2 rounded-xl bg-cardBg hover:bg-slate-800 border border-slate-700/80 text-slate-300 text-xs font-medium transition flex items-center gap-1.5 shrink-0">
                            <i class="fa-solid fa-dice text-slate-400"></i>
                            <span>隨機</span>
                        </button>

                        <!-- Quick Color Swatch Options -->
                        <div class="flex items-center gap-1.5 pl-1 sm:border-l border-slate-800 shrink-0">
                            <span class="text-xs text-slate-500 hidden xl:inline mr-1">快捷試色：</span>
                            <div id="quickSwatchesContainer" class="flex items-center gap-1.5 overflow-x-auto py-0.5 max-w-[200px] sm:max-w-none">
                                <!-- Dynamic swatches generated on load -->
                            </div>
                        </div>
                    </div>

                    <!-- Add to Palette Action Button -->
                    <button onclick="addColorToPalette()" id="addBtn" class="px-4 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 border border-slate-600/80 active:scale-[0.98] text-slate-100 font-medium text-xs transition shadow-sm flex items-center justify-center gap-1.5 shrink-0">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span id="addBtnText">加入 ( 0 / 8 )</span>
                    </button>
                </div>

                <!-- BOTTOM AREA: Live Color Palette Display Container -->
                <div class="space-y-2.5 w-full">
                    <div class="flex items-center justify-between text-xs text-slate-400 px-1">
                        <span class="font-medium text-slate-300 flex items-center gap-2">
                            <span>即時色彩組合</span>
                            <span id="paletteCountText" class="text-slate-400 font-mono text-[11px]">(0/8)</span>
                        </span>
                        <span class="text-slate-500"><i class="fa-regular fa-lightbulb text-slate-400 mr-1"></i>點擊色塊或 Hex 碼即可複製</span>
                    </div>

                    <!-- Palette Bar Block -->
                    <div id="paletteContainer" class="w-full transition-all space-y-2">
                        <!-- Seamless connected palette bar without #1 #2 labels generated dynamically -->
                    </div>
                </div>

                <!-- Palette Tools Bar -->
                <div class="flex flex-wrap items-center justify-between gap-3 pt-2 text-xs text-slate-400 border-t border-cardBorderSubtle">
                    <div class="flex flex-wrap items-center gap-2">
                        <span class="text-slate-500">快速調色：</span>
                        <button onclick="generateHarmony('analogous')" class="px-2.5 py-1 rounded-lg bg-cardBg hover:bg-slate-800 text-slate-300 border border-slate-700/60 transition">類似色</button>
                        <button onclick="generateHarmony('complementary')" class="px-2.5 py-1 rounded-lg bg-cardBg hover:bg-slate-800 text-slate-300 border border-slate-700/60 transition">互補色</button>
                        <button onclick="generateHarmony('triadic')" class="px-2.5 py-1 rounded-lg bg-cardBg hover:bg-slate-800 text-slate-300 border border-slate-700/60 transition">三角色</button>
                        <button onclick="generateHarmony('monochromatic')" class="px-2.5 py-1 rounded-lg bg-cardBg hover:bg-slate-800 text-slate-300 border border-slate-700/60 transition">單色系</button>
                    </div>

                    <button onclick="copyCSSVariables()" class="px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700/60 transition flex items-center gap-1.5 font-mono text-xs">
                        <i class="fa-regular fa-copy"></i>
                        <span>複製 CSS 變數</span>
                    </button>
                </div>

            </div>
        </section>

        <section class="space-y-3.5">
            <h3 class="text-sm font-medium text-slate-300 flex items-center gap-2">
                <i class="fa-solid fa-layer-group text-slate-400"></i>
                <span>UI 效果與對比預覽</span>
            </h3>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Mockup Card 1: Buttons & Badges -->
                <div class="bg-cardBg rounded-xl p-4 border border-cardBorder space-y-3">
                    <h4 class="text-[11px] font-medium uppercase tracking-wider text-slate-500">按鈕樣式</h4>
                    <div class="flex flex-wrap gap-2" id="previewButtons">
                        <!-- Dynamic Button Previews -->
                    </div>
                </div>

                <!-- Mockup Card 2: UI Card Example -->
                <div class="bg-cardBg rounded-xl p-4 border border-cardBorder space-y-3">
                    <h4 class="text-[11px] font-medium uppercase tracking-wider text-slate-500">卡片示範</h4>
                    <div id="previewCardSample" class="p-3.5 rounded-xl transition-all border border-slate-700/40 space-y-2">
                        <div class="h-2.5 w-1/3 rounded-full bg-white/20"></div>
                        <div class="h-2 w-2/3 rounded-full bg-white/10"></div>
                        <div class="pt-1.5 flex justify-end">
                            <span id="previewCardBadge" class="text-[9px] px-2 py-0.5 rounded-full font-semibold tracking-wider">PREVIEW</span>
                        </div>
                    </div>
                </div>

                <!-- Mockup Card 3: Color Contrast Accessibility -->
                <div class="bg-cardBg rounded-xl p-4 border border-cardBorder space-y-3">
                    <h4 class="text-[11px] font-medium uppercase tracking-wider text-slate-500">WCAG 對比度</h4>
                    <div id="contrastCheckContainer" class="space-y-2">
                        <!-- Dynamic Contrast List -->
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Saved Palettes Drawer -->
    <div id="savedDrawer" class="fixed inset-y-0 right-0 w-full sm:w-96 bg-cardBg border-l border-cardBorder shadow-2xl z-50 transform translate-x-full transition-transform duration-250 ease-in-out flex flex-col">
        <!-- Drawer Header -->
        <div class="p-4 border-b border-cardBorder space-y-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-bookmark text-slate-400 text-xs"></i>
                    <h3 class="font-medium text-slate-200 text-sm">已儲存色票庫</h3>
                </div>
                <button onclick="toggleSavedDrawer()" class="text-slate-400 hover:text-slate-200 p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>
            <!-- Search & View Mode Switcher -->
            <div class="flex items-center gap-2">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="text" id="savedSearchInput" oninput="renderSavedDrawer()" placeholder="搜尋名稱或 Hex 色碼..." class="w-full bg-darkBg border border-slate-700/60 rounded-xl pl-8 pr-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-slate-500 placeholder-slate-500">
                </div>
                <div class="flex items-center bg-darkBg rounded-xl p-1 border border-slate-800 shrink-0">
                    <button id="viewBtnDetailed" onclick="setSavedViewMode('detailed')" class="px-2 py-1 rounded-lg text-xs transition text-slate-200 bg-cardBg shadow-sm" title="詳細視圖">
                        <i class="fa-solid fa-list"></i>
                    </button>
                    <button id="viewBtnCompact" onclick="setSavedViewMode('compact')" class="px-2 py-1 rounded-lg text-xs transition text-slate-500 hover:text-slate-300" title="精簡視圖">
                        <i class="fa-solid fa-table-cells-large"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Drawer Content -->
        <div id="savedPalettesList" class="flex-1 overflow-y-auto p-4 space-y-3">
            <!-- Saved items populated dynamically -->
        </div>
    </div>

    <!-- Save Palette Naming Modal -->
    <div id="saveModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-xs opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-cardBg border border-cardBorder rounded-2xl p-5 w-full max-w-md mx-4 shadow-xl space-y-4 transform scale-95 transition-transform duration-200">
            <div class="flex items-center justify-between border-b border-cardBorderSubtle pb-2.5">
                <h3 class="font-medium text-slate-200 text-base flex items-center gap-2">
                    <i class="fa-regular fa-bookmark text-slate-400"></i>
                    <span>儲存色票組合</span>
                </h3>
                <button onclick="closeSaveModal()" class="text-slate-400 hover:text-slate-200 p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>
            <div class="space-y-1.5">
                <label class="text-xs font-medium text-slate-400">色票組合名稱</label>
                <input type="text" id="paletteNameInput" placeholder="例如：極簡冷調、莫蘭迪日落..." class="w-full bg-darkBg border border-slate-700/80 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-slate-500 font-medium">
            </div>
            <!-- Color preview strip inside modal -->
            <div id="modalColorPreview" class="flex h-6 rounded-lg overflow-hidden border border-slate-700/60"></div>
            <div class="flex justify-end gap-2 pt-1">
                <button onclick="closeSaveModal()" class="px-3.5 py-1.5 rounded-xl text-slate-400 hover:bg-slate-800/80 text-xs font-medium transition">取消</button>
                <button onclick="confirmSavePalette()" class="px-4 py-1.5 rounded-xl bg-slate-700 hover:bg-slate-600 border border-slate-600/80 text-slate-100 text-xs font-medium transition shadow-sm">確認儲存</button>
            </div>
        </div>
    </div>

    <!-- Floating Toggle Tab -->
    <button onclick="toggleSavedDrawer()" class="fixed right-0 top-1/2 -translate-y-1/2 z-20 bg-slate-800 hover:bg-slate-700 text-slate-300 border-l border-t border-b border-slate-700/80 px-2 py-3.5 rounded-l-xl shadow-md flex flex-col items-center gap-2 text-xs font-medium transition">
        <i class="fa-solid fa-bookmark text-xs text-slate-400"></i>
        <span class="writing-mode-vertical tracking-widest py-1 text-[11px]" style="writing-mode: vertical-rl;">已儲存色票</span>
        <span id="floatingSavedBadge" class="bg-slate-700 text-slate-200 w-4 h-4 rounded-full flex items-center justify-center font-mono text-[9px]">0</span>
    </button>

    <!-- Toast Notification Overlay -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-800 text-slate-200 px-4 py-2 rounded-xl border border-slate-700 shadow-xl opacity-0 pointer-events-none transition-all duration-200 flex items-center gap-2 text-xs font-medium">
        <i class="fa-solid fa-circle-check text-slate-400" id="toastIcon"></i>
        <span id="toastMsg">已複製色碼</span>
    </div>

    <script>
        // State variables
        let currentColors = [];
        let savedPalettes = [];
        let savedViewMode = 'detailed'; // 'detailed' | 'compact'

        // DOM elements
        const pickerInput = document.getElementById('pickerInput');
        const hexText = document.getElementById('hexText');
        const paletteContainer = document.getElementById('paletteContainer');
        const addBtnText = document.getElementById('addBtnText');
        const paletteCountText = document.getElementById('paletteCountText');

        window.onload = function() {
            try {
                const stored = localStorage.getItem('chroma_saved_palettes');
                if (stored) {
                    savedPalettes = JSON.parse(stored);
                }
            } catch (e) {
                console.error("Could not load saved palettes", e);
            }

            // 每次載入時隨機產生工作區預設色票 (4 個顏色)
            currentColors = Array.from({ length: 4 }, () => getRandomHexColor());

            // 每次載入時隨機產生快捷試色塊
            renderRandomQuickSwatches();

            // 同步選擇器為第一個隨機色
            if (currentColors.length > 0) {
                syncColorFromPicker(currentColors[0]);
            }

            renderPalette();
            renderSavedDrawer();
            updateUIPreviews();
        };

        function getRandomHexColor() {
            return '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0').toUpperCase();
        }

        function renderRandomQuickSwatches() {
            const container = document.getElementById('quickSwatchesContainer');
            if (!container) return;
            container.innerHTML = '';
            
            for (let i = 0; i < 8; i++) {
                const hex = getRandomHexColor();
                const btn = document.createElement('button');
                btn.className = "w-5 h-5 rounded transition hover:scale-110 shadow-sm shrink-0";
                btn.style.backgroundColor = hex;
                btn.title = hex;
                btn.onclick = () => setPickerColor(hex);
                container.appendChild(btn);
            }
        }

        function syncColorFromPicker(color) {
            pickerInput.value = color;
            hexText.value = color.replace('#', '').toUpperCase();
        }

        function syncColorFromText(val) {
            const cleanVal = val.replace(/[^0-9A-Fa-f]/g, '');
            hexText.value = cleanVal;
            if (cleanVal.length === 6) {
                pickerInput.value = '#' + cleanVal;
            }
        }

        function setPickerColor(hex) {
            syncColorFromPicker(hex);
        }

        function generateRandomColor() {
            const randomHex = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0').toUpperCase();
            syncColorFromPicker(randomHex);
        }

        function addColorToPalette() {
            if (currentColors.length >= 8) {
                showToast("最多只能新增 8 個顏色！", "warning");
                return;
            }
            let color = '#' + hexText.value.trim();
            if (!/^#[0-9A-Fa-f]{6}$/.test(color)) {
                color = pickerInput.value;
            }
            currentColors.push(color.toUpperCase());
            renderPalette();
            updateUIPreviews();
            showToast(`已新增 ${color.toUpperCase()}`);
        }

        function moveColorLeft(idx) {
            if (idx <= 0) return;
            const temp = currentColors[idx];
            currentColors[idx] = currentColors[idx - 1];
            currentColors[idx - 1] = temp;
            renderPalette();
            updateUIPreviews();
        }

        function moveColorRight(idx) {
            if (idx >= currentColors.length - 1) return;
            const temp = currentColors[idx];
            currentColors[idx] = currentColors[idx + 1];
            currentColors[idx + 1] = temp;
            renderPalette();
            updateUIPreviews();
        }

        function duplicateColor(idx) {
            if (currentColors.length >= 8) {
                showToast("最多只能新增 8 個顏色！", "warning");
                return;
            }
            const colorToCopy = currentColors[idx];
            currentColors.splice(idx + 1, 0, colorToCopy);
            renderPalette();
            updateUIPreviews();
            showToast(`已複製色塊 ${colorToCopy}`);
        }

        function removeColor(index) {
            currentColors.splice(index, 1);
            renderPalette();
            updateUIPreviews();
            showToast("已刪除色塊");
        }

        function clearWorkspace() {
            if (currentColors.length === 0) return;
            currentColors = [];
            renderPalette();
            updateUIPreviews();
            showToast("已清空工作區");
        }

        function renderPalette() {
            paletteContainer.innerHTML = '';
            const count = currentColors.length;

            paletteCountText.textContent = `(${count}/8)`;
            addBtnText.textContent = `加入 ( ${count} / 8 )`;

            if (count === 0) {
                paletteContainer.className = "w-full min-h-[140px] rounded-xl overflow-hidden border border-slate-800 flex flex-col items-center justify-center text-slate-500 gap-2 bg-darkBg/60 p-6";
                paletteContainer.innerHTML = `
                    <i class="fa-regular fa-palette text-2xl mb-1 text-slate-600"></i>
                    <span class="text-xs">工作區目前沒有顏色，請從上方選擇顏色並點擊「加入」</span>
                `;
                return;
            }

            paletteContainer.className = "w-full space-y-2.5";

            // 1. Seamless connected color palette bar (NO #1, #2 overlay badges)
            const topBar = document.createElement('div');
            topBar.className = "w-full flex h-24 sm:h-28 rounded-xl overflow-hidden border border-cardBorder shadow-md bg-cardBg transition-all";

            // 2. Aligned bottom controls container
            const bottomControls = document.createElement('div');
            bottomControls.className = "w-full flex gap-1.5 sm:gap-2 pt-0.5";

            currentColors.forEach((color, idx) => {
                // --- TOP BAR COLOR SEGMENT (Clean without text) ---
                const segment = document.createElement('div');
                segment.className = `flex-1 h-full relative group cursor-pointer transition-all hover:brightness-105 flex items-center justify-center select-none`;
                segment.style.backgroundColor = color;
                segment.setAttribute('onclick', `copyText('${color}')`);

                segment.innerHTML = `
                    <div class="opacity-0 group-hover:opacity-100 transition-opacity bg-black/50 backdrop-blur-xs rounded px-2 py-0.5 text-[10px] text-white flex items-center gap-1 font-medium shadow-sm">
                        <i class="fa-regular fa-copy text-slate-300"></i>
                        <span>複製</span>
                    </div>
                `;
                topBar.appendChild(segment);

                // --- BOTTOM CONTROL COLUMN ---
                const col = document.createElement('div');
                col.className = `flex-1 bg-cardBg border border-cardBorder rounded-xl p-1.5 sm:p-2 flex flex-col justify-between gap-1 text-center min-w-0 shadow-sm hover:border-slate-600/70 transition`;

                col.innerHTML = `
                    <!-- Hex Button -->
                    <button onclick="copyText('${color}')" class="font-mono font-medium text-[11px] sm:text-xs text-slate-200 hover:text-slate-400 transition truncate w-full" title="點擊複製 Hex">
                        ${color}
                    </button>

                    <!-- 4 Action Buttons Row -->
                    <div class="flex items-center justify-around w-full pt-1 border-t border-cardBorderSubtle text-slate-400">
                        <!-- Move Left -->
                        <button onclick="event.stopPropagation(); moveColorLeft(${idx})" ${idx === 0 ? 'disabled class="opacity-20 cursor-not-allowed p-1 text-[10px]"' : 'class="p-1 hover:text-slate-200 hover:bg-slate-800/80 rounded transition text-[10px]"'} title="向左移動">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        
                        <!-- Move Right -->
                        <button onclick="event.stopPropagation(); moveColorRight(${idx})" ${idx === count - 1 ? 'disabled class="opacity-20 cursor-not-allowed p-1 text-[10px]"' : 'class="p-1 hover:text-slate-200 hover:bg-slate-800/80 rounded transition text-[10px]"'} title="向右移動">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>

                        <!-- Duplicate -->
                        <button onclick="event.stopPropagation(); duplicateColor(${idx})" class="p-1 hover:text-slate-200 hover:bg-slate-800/80 rounded transition text-[10px]" title="複製色塊">
                            <i class="fa-regular fa-clone"></i>
                        </button>

                        <!-- Remove -->
                        <button onclick="event.stopPropagation(); removeColor(${idx})" class="p-1 hover:text-rose-400 hover:bg-slate-800/80 rounded transition text-[10px]" title="刪除色塊">
                            <i class="fa-regular fa-trash-can"></i>
                        </button>
                    </div>
                `;
                bottomControls.appendChild(col);
            });

            paletteContainer.appendChild(topBar);
            paletteContainer.appendChild(bottomControls);
        }

        function generateHarmony(type) {
            if (currentColors.length === 0) {
                generateRandomColor();
                addColorToPalette();
            }
            const baseHex = currentColors[0] || pickerInput.value;
            const hsl = hexToHSL(baseHex);

            let newColors = [baseHex];

            if (type === 'analogous') {
                newColors.push(hslToHex((hsl.h + 30) % 360, hsl.s, hsl.l));
                newColors.push(hslToHex((hsl.h + 60) % 360, hsl.s, hsl.l));
                newColors.push(hslToHex((hsl.h - 30 + 360) % 360, hsl.s, hsl.l));
            } else if (type === 'complementary') {
                newColors.push(hslToHex((hsl.h + 180) % 360, hsl.s, hsl.l));
                newColors.push(hslToHex((hsl.h + 180) % 360, Math.max(0, hsl.s - 20), Math.min(100, hsl.l + 15)));
                newColors.push(hslToHex(hsl.h, Math.max(0, hsl.s - 20), Math.max(10, hsl.l - 20)));
            } else if (type === 'triadic') {
                newColors.push(hslToHex((hsl.h + 120) % 360, hsl.s, hsl.l));
                newColors.push(hslToHex((hsl.h + 240) % 360, hsl.s, hsl.l));
            } else if (type === 'monochromatic') {
                newColors.push(hslToHex(hsl.h, hsl.s, Math.min(90, hsl.l + 25)));
                newColors.push(hslToHex(hsl.h, hsl.s, Math.max(10, hsl.l - 20)));
                newColors.push(hslToHex(hsl.h, Math.max(10, hsl.s - 30), Math.min(80, hsl.l + 10)));
            }

            currentColors = newColors.slice(0, 8);
            renderPalette();
            updateUIPreviews();
            showToast(`已生成${getHarmonyTypeName(type)}色彩`);
        }

        function getHarmonyTypeName(type) {
            const names = {
                analogous: '類似色',
                complementary: '互補色',
                triadic: '三角色',
                monochromatic: '單色系'
            };
            return names[type] || '';
        }

        function updateUIPreviews() {
            const btns = document.getElementById('previewButtons');
            const cardSample = document.getElementById('previewCardSample');
            const cardBadge = document.getElementById('previewCardBadge');
            const contrastContainer = document.getElementById('contrastCheckContainer');

            if (!btns || !cardSample || !cardBadge || !contrastContainer) return;

            btns.innerHTML = '';
            contrastContainer.innerHTML = '';

            if (currentColors.length === 0) {
                btns.innerHTML = `<span class="text-xs text-slate-500">（請先新增顏色）</span>`;
                cardSample.style.backgroundColor = '#20232b';
                cardBadge.style.backgroundColor = '#2d313c';
                cardBadge.style.color = '#ffffff';
                contrastContainer.innerHTML = `<span class="text-xs text-slate-500">（請先新增顏色）</span>`;
                return;
            }

            // Render Preview Buttons
            currentColors.forEach((color, i) => {
                const isLight = getLuminance(color) > 0.55;
                const textColor = isLight ? '#0f172a' : '#ffffff';
                const btn = document.createElement('button');
                btn.className = 'px-3 py-1 rounded-lg text-xs font-medium shadow-xs transition hover:opacity-90';
                btn.style.backgroundColor = color;
                btn.style.color = textColor;
                btn.textContent = `按鈕 ${i + 1}`;
                btn.onclick = () => copyText(color);
                btns.appendChild(btn);
            });

            // Update Card Sample
            const primaryColor = currentColors[0];
            const secondaryColor = currentColors[1] || currentColors[0];
            cardSample.style.backgroundColor = primaryColor;
            cardBadge.style.backgroundColor = secondaryColor;
            cardBadge.style.color = getLuminance(secondaryColor) > 0.55 ? '#0f172a' : '#ffffff';

            // WCAG Contrast Checks
            if (currentColors.length >= 2) {
                for (let i = 0; i < Math.min(currentColors.length - 1, 3); i++) {
                    const c1 = currentColors[i];
                    const c2 = currentColors[i + 1];
                    const ratio = getContrastRatio(c1, c2).toFixed(2);
                    const passesAA = ratio >= 4.5;
                    const passesAAA = ratio >= 7;

                    const item = document.createElement('div');
                    item.className = 'flex items-center justify-between text-xs p-1.5 rounded-lg bg-darkBg/60 border border-cardBorderSubtle';
                    item.innerHTML = `
                        <div class="flex items-center gap-2">
                            <span class="w-3.5 h-3.5 rounded-full border border-white/20" style="background-color: ${c1}"></span>
                            <span class="text-slate-500 text-[10px]">vs</span>
                            <span class="w-3.5 h-3.5 rounded-full border border-white/20" style="background-color: ${c2}"></span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="font-mono text-slate-300 font-medium text-[11px]">${ratio}:1</span>
                            <span class="px-1.5 py-0.5 rounded text-[9px] font-medium ${passesAA ? 'bg-slate-800 text-slate-300 border border-slate-700' : 'bg-slate-800/50 text-slate-500 border border-slate-800'}">
                                ${passesAAA ? 'AAA' : (passesAA ? 'AA' : '對比不足')}
                            </span>
                        </div>
                    `;
                    contrastContainer.appendChild(item);
                }
            } else {
                contrastContainer.innerHTML = `<span class="text-xs text-slate-500">（需至少 2 個顏色）</span>`;
            }
        }

        function openSaveModal() {
            if (currentColors.length === 0) {
                showToast("工作區沒有顏色可供儲存！", "warning");
                return;
            }
            const modal = document.getElementById('saveModal');
            const input = document.getElementById('paletteNameInput');
            const modalPreview = document.getElementById('modalColorPreview');

            input.value = `色票組合 #${savedPalettes.length + 1}`;
            modalPreview.innerHTML = currentColors.map(c => `<div class="flex-1 h-full" style="background-color: ${c}"></div>`).join('');

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.classList.add('opacity-100');
            setTimeout(() => input.select(), 100);
        }

        function closeSaveModal() {
            const modal = document.getElementById('saveModal');
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        function confirmSavePalette() {
            const input = document.getElementById('paletteNameInput');
            const title = input.value.trim() || `色票組合 #${savedPalettes.length + 1}`;

            const newPalette = {
                id: Date.now(),
                title: title,
                colors: [...currentColors],
                date: new Date().toLocaleDateString('zh-TW')
            };

            savedPalettes.unshift(newPalette);
            try {
                localStorage.setItem('chroma_saved_palettes', JSON.stringify(savedPalettes));
            } catch (e) {}

            closeSaveModal();
            renderSavedDrawer();
            showToast(`已儲存「${title}」`);
        }

        function setSavedViewMode(mode) {
            savedViewMode = mode;
            const btnDetailed = document.getElementById('viewBtnDetailed');
            const btnCompact = document.getElementById('viewBtnCompact');
            if (mode === 'detailed') {
                btnDetailed.className = 'px-2 py-1 rounded-lg text-xs transition text-slate-200 bg-cardBg shadow-sm';
                btnCompact.className = 'px-2 py-1 rounded-lg text-xs transition text-slate-500 hover:text-slate-300';
            } else {
                btnCompact.className = 'px-2 py-1 rounded-lg text-xs transition text-slate-200 bg-cardBg shadow-sm';
                btnDetailed.className = 'px-2 py-1 rounded-lg text-xs transition text-slate-500 hover:text-slate-300';
            }
            renderSavedDrawer();
        }

        function renderSavedDrawer() {
            const container = document.getElementById('savedPalettesList');
            const savedCountBadge = document.getElementById('savedCountBadge');
            const floatingSavedBadge = document.getElementById('floatingSavedBadge');
            const searchVal = (document.getElementById('savedSearchInput')?.value || '').trim().toLowerCase();

            savedCountBadge.textContent = savedPalettes.length;
            floatingSavedBadge.textContent = savedPalettes.length;

            if (savedPalettes.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-500 space-y-2">
                        <i class="fa-regular fa-folder-open text-2xl"></i>
                        <p class="text-xs">尚未儲存任何色票組合</p>
                    </div>
                `;
                return;
            }

            const filtered = savedPalettes.filter(item => {
                if (!searchVal) return true;
                const matchesName = item.title.toLowerCase().includes(searchVal);
                const matchesHex = item.colors.some(c => c.toLowerCase().includes(searchVal));
                return matchesName || matchesHex;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-slate-500 space-y-2">
                        <i class="fa-solid fa-magnifying-glass text-xl"></i>
                        <p class="text-xs">未找到符合「${searchVal}」的色票</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';

            if (savedViewMode === 'detailed') {
                filtered.forEach((item) => {
                    const card = document.createElement('div');
                    card.className = 'bg-darkBg/90 border border-cardBorder rounded-xl p-3 space-y-2.5 hover:border-slate-700 transition shadow-xs';

                    const colorBars = item.colors.map(c => `<div class="flex-1 h-7 first:rounded-l-md last:rounded-r-md group relative cursor-pointer" style="background-color: ${c}" onclick="copyText('${c}')" title="點擊複製 ${c}"></div>`).join('');
                    const hexBadges = item.colors.map(c => `<span class="text-[10px] font-mono text-slate-400 hover:text-slate-200 cursor-pointer" onclick="copyText('${c}')">${c}</span>`).join(' ');

                    card.innerHTML = `
                        <div class="flex items-center justify-between">
                            <div>
                                <h4 class="text-xs font-medium text-slate-200">${item.title}</h4>
                                <span class="text-[9px] text-slate-500">${item.date}</span>
                            </div>
                            <div class="flex items-center space-x-1">
                                <button onclick="loadSavedPalette(${item.id})" class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-300 text-xs" title="載入至工作區">
                                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                                </button>
                                <button onclick="deleteSavedPalette(${item.id})" class="p-1.5 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-rose-400 text-xs" title="刪除">
                                    <i class="fa-regular fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                        <div class="flex rounded-md overflow-hidden border border-slate-800">
                            ${colorBars}
                        </div>
                        <div class="flex flex-wrap gap-1.5 pt-0.5 border-t border-cardBorderSubtle">
                            ${hexBadges}
                        </div>
                    `;
                    container.appendChild(card);
                });
            } else {
                // Compact View
                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-2 gap-2';

                filtered.forEach((item) => {
                    const card = document.createElement('div');
                    card.className = 'bg-darkBg/90 border border-cardBorder rounded-xl p-2.5 space-y-2 hover:border-slate-700 transition flex flex-col justify-between shadow-xs';

                    const colorBars = item.colors.map(c => `<div class="flex-1 h-4 first:rounded-l-sm last:rounded-r-sm" style="background-color: ${c}"></div>`).join('');

                    card.innerHTML = `
                        <div>
                            <div class="flex items-center justify-between gap-1 mb-1.5">
                                <h4 class="text-[11px] font-medium text-slate-200 truncate flex-1" title="${item.title}">${item.title}</h4>
                            </div>
                            <div class="flex rounded-sm overflow-hidden border border-slate-800">
                                ${colorBars}
                            </div>
                        </div>
                        <div class="flex items-center justify-between pt-1 border-t border-cardBorderSubtle text-[10px] text-slate-400">
                            <span class="text-[9px] text-slate-500">${item.colors.length} 色</span>
                            <div class="flex gap-1">
                                <button onclick="loadSavedPalette(${item.id})" class="hover:text-slate-200 p-0.5" title="載入">
                                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                                </button>
                                <button onclick="deleteSavedPalette(${item.id})" class="hover:text-rose-400 p-0.5" title="刪除">
                                    <i class="fa-regular fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
                container.appendChild(grid);
            }
        }

        function loadSavedPalette(id) {
            const item = savedPalettes.find(p => p.id === id);
            if (item) {
                currentColors = [...item.colors];
                renderPalette();
                updateUIPreviews();
                showToast(`已載入「${item.title}」`);
                toggleSavedDrawer();
            }
        }

        function deleteSavedPalette(id) {
            savedPalettes = savedPalettes.filter(p => p.id !== id);
            try {
                localStorage.setItem('chroma_saved_palettes', JSON.stringify(savedPalettes));
            } catch (e) {}
            renderSavedDrawer();
            showToast("已刪除該色票組合");
        }

        function toggleSavedDrawer() {
            const drawer = document.getElementById('savedDrawer');
            drawer.classList.toggle('translate-x-full');
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentColors, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `palettechips_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast("已成功匯出 JSON 檔案");
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        currentColors = imported.filter(c => /^#[0-9A-Fa-f]{6}$/.test(c)).slice(0, 8);
                        renderPalette();
                        updateUIPreviews();
                        showToast("JSON 色票成功匯入！");
                    } else {
                        showToast("匯入格式不正確！", "warning");
                    }
                } catch (err) {
                    showToast("讀取 JSON 失敗！", "warning");
                }
            };
            reader.readAsText(file);
        }

        function copyCSSVariables() {
            if (currentColors.length === 0) return;
            const cssText = currentColors.map((c, i) => `  --color-${i + 1}: ${c};`).join('\n');
            copyText(`:root {\n${cssText}\n}`);
            showToast("已複製 CSS 變數");
        }

        function copyText(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast(`${text} 已複製到剪貼簿`);
            } catch (err) {
                console.error("複製失敗", err);
            }
            document.body.removeChild(textarea);
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.textContent = message;
            if (type === 'warning') {
                toastIcon.className = "fa-solid fa-circle-exclamation text-slate-400";
            } else {
                toastIcon.className = "fa-solid fa-circle-check text-slate-300";
            }

            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }

        function getLuminance(hex) {
            const rgb = hexToRgb(hex);
            if (!rgb) return 0;
            const a = [rgb.r, rgb.g, rgb.b].map(v => {
                v /= 255;
                return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
            });
            return a[0] * 0.2126 + a[1] * 0.7152 + a[2] * 0.0722;
        }

        function getContrastRatio(hex1, hex2) {
            const lum1 = getLuminance(hex1);
            const lum2 = getLuminance(hex2);
            const brightest = Math.max(lum1, lum2);
            const darkest = Math.min(lum1, lum2);
            return (brightest + 0.05) / (darkest + 0.05);
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function hexToHSL(hex) {
            let { r, g, b } = hexToRgb(hex);
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;

            if (max === min) {
                h = s = 0;
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
        }

        function hslToHex(h, s, l) {
            s /= 100;
            l /= 100;
            const k = n => (n + h / 30) % 12;
            const a = s * Math.min(l, 1 - l);
            const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
            const rgb = [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
            return "#" + rgb.map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase();
        }
